name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-OS smoke: tests + one jpackage type so we catch host-specific
          # regressions in shadowJar + jpackage early. Signing/notarization is
          # release-only; CI produces an unsigned DMG by omitting the
          # `strange-eons.apple.signing.identity` Gradle property.
          - os: ubuntu-latest
            jpackage_task: ":strange-eons-app:jpackageDeb"
            extra_setup: sudo apt-get update && sudo apt-get install -y rpm fakeroot xvfb
            gradle_prefix: xvfb-run -a
          - os: macos-15
            jpackage_task: ":strange-eons-app:jpackageDmg"
            extra_setup: ""
            gradle_prefix: ""
          - os: windows-latest
            jpackage_task: ":strange-eons-app:jpackageMsi"
            extra_setup: ""
            gradle_prefix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Extra setup for runner
        if: matrix.extra_setup != ''
        shell: bash
        run: ${{ matrix.extra_setup }}
      # Several Strange Eons classes touch AWT in their static initializers
      # (PlatformSupport, AbstractStrangeEonsEditor, etc.). Mockito's class
      # instrumentation triggers those <clinit>s, which throw HeadlessException
      # on a headless runner. Linux wraps the build in xvfb-run; macOS and
      # Windows runners have AWT available natively. Tracked by issue #4.
      - name: Run tests + smoke jpackage
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.gradle_prefix }} ./gradlew --no-daemon \
            :strange-eons-app:check ${{ matrix.jpackage_task }}
      - name: Upload JVM crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-crash-reports-${{ matrix.os }}
          path: "**/hs_err_pid*.log"
          if-no-files-found: ignore
      - name: Verify library publication
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./gradlew --no-daemon \
            :strange-eons-script-api:check \
            :strange-eons-script-api:publishToMavenLocal

  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.repository == 'strange-eons/strange-eons' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Publish snapshot to Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew --no-daemon :strange-eons-script-api:publishToMavenCentral
